[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "br-municipios-panel"
version = "0.1.0"
description = "ETL library for a harmonized panel of socioeconomic, fiscal, health, territorial and educational indicators for Brazilian municipalities (IBGE, Tesouro Nacional, IPEA Data, DATASUS, INEP)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lucas Guesse" }]
dependencies = [
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "xlrd>=2.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "access-parser==0.0.6",
    "construct>=2.10.70",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9.0", "seaborn>=0.13.0"]

[tool.setuptools.packages.find]
where = ["src"]
